<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="2; url=https://www.brewgene.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to BrewGene — Grow with Google Farm & Taproom</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>">
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #141b2d;
      border: 2px solid #f59e0b;
      padding: 32px;
      border-radius: 16px;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h1 { font-size: 24px; margin-bottom: 8px; color: #f59e0b; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 800;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Connecting to BrewGene</h1>
    <p>Forwarding to the BrewGene craft beer rating, cellar tracking, and community intelligence database...</p>
    <a class="btn" href="https://www.brewgene.com">Click here if not redirected</a>
  </div>
</body>
</html>
