<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="900"
  viewBox="0 0 1200 900"
  role="img"
  aria-labelledby="title desc">

  <title id="title">The Synoptic Spire — 365-Day Volatility &amp; Legal Compliance Blueprint</title>
  <desc id="desc">
    Architectural engineering blueprint of a multi-tiered aerodynamic skyscraper featuring
    Tuned Mass Damper volatility stabilization, EU AI Act conformity, and NIST AI RMF governance.
  </desc>

  <defs>
    <!-- Sexy Gradients -->
    <linearGradient id="spireGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glassFacade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="damperCore" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>

    <linearGradient id="windStream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="stampShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    @keyframes damperSway {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-14px, 1px); }
      75% { transform: translate(14px, -1px); }
    }
    @keyframes windFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: -80; }
    }
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.6); }
    }

    .damper-motion {
      animation: damperSway 4s ease-in-out infinite;
      transform-origin: 600px 220px;
    }
    .wind-anim {
      stroke-dasharray: 12, 16;
      animation: windFlow 2.5s linear infinite;
    }
    .beacon {
      animation: beaconPulse 1.8s ease-in-out infinite;
      transform-origin: 600px 92px;
    }
  </style>

  <!-- DELIBERATELY TRANSPARENT BACKGROUND: Blends seamlessly with GitHub Light/Dark modes -->

  <!-- ================= TOP BLUEPRINT HEADER ================= -->
  <g class="mono">
    <text x="50" y="42" font-size="16" font-weight="900" fill="#0284c7" letter-spacing="1">
      PROJECT // THE SYNOPTIC SPIRE
    </text>
    <text x="50" y="60" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">
      365-DAY VOLATILITY DAMPING &amp; HIGH-RISE LEGAL RESILIENCE ENGINE &#8226; ARCHITECT: [PT:AC] ANDY KIECKHEFER
    </text>
    
    <text x="1150" y="42" text-anchor="end" font-size="12" font-weight="800" fill="#10b981">
      PERMIT STATUS: FULLY STAMPED &amp; APPROVED
    </text>
    <text x="1150" y="60" text-anchor="end" font-size="11" fill="#64748b">
      EU AI ACT 2024/1689 &#8226; NIST AI RMF 1.0 &#8226; ISO 42001
    </text>
  </g>

  <!-- ================= WEATHER VOLATILITY STREAMLINES (WIND LOADS) ================= -->
  <!-- Crosswinds impacting windward facade and deflecting smoothly -->
  <g stroke="url(#windStream)" stroke-width="2.5" fill="none" class="wind-anim">
    <path d="M 60 160 C 300 160, 480 140, 570 145 C 600 147, 630 147, 720 120 C 850 80, 1140 80, 1140 80"/>
    <path d="M 60 260 C 260 260, 450 250, 540 230 C 600 215, 660 220, 750 280 C 880 360, 1140 360, 1140 360"/>
    <path d="M 60 380 C 220 380, 420 375, 510 360 C 580 348, 640 350, 720 420 C 820 500, 1140 500, 1140 500"/>
    <path d="M 60 520 C 200 520, 380 520, 480 515 C 570 510, 640 520, 740 580 C 850 640, 1140 640, 1140 640"/>
  </g>

  <g class="mono" font-size="10" fill="#38bdf8" opacity="0.85">
    <text x="80" y="152">&#8594; GALE-FORCE CROSSWINDS (48 KTS) // VOLATILITY DRIFT</text>
    <text x="80" y="252">&#8594; SHEAR FORCES // UPSTREAM API LOAD</text>
    <text x="80" y="372">&#8594; MICROBURSTS // REGULATORY AUDIT CONGESTION</text>
  </g>

  <!-- ================= THE SKYSCRAPER SUPERSTRUCTURE (CENTER) ================= -->
  
  <!-- Foundation Bedrock & Caissons (Days 1–60) -->
  <g transform="translate(420, 770)">
    <rect x="0" y="0" width="360" height="40" rx="4" fill="#334155" opacity="0.9"/>
    <!-- Deep Piles / Caissons into Bedrock -->
    <line x1="30" y1="40" x2="30" y2="85" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <line x1="90" y1="40" x2="90" y2="95" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="40" x2="180" y2="105" stroke="#0284c7" stroke-width="10" stroke-linecap="round"/>
    <line x1="270" y1="40" x2="270" y2="95" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <line x1="330" y1="40" x2="330" y2="85" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <text class="mono" x="180" y="25" text-anchor="middle" font-size="11" font-weight="800" fill="#f8fafc">
      BEDROCK CAISSONS // DAYS 1–60 (EU AI ACT ART. 9 &amp; 10)
    </text>
  </g>

  <!-- Lower Podium / Base Tier (Days 61–150) -->
  <polygon
    points="440,770 760,770 730,580 470,580"
    fill="url(#spireGlow)"
    stroke="#38bdf8"
    stroke-width="2.5"
  />
  
  <!-- Mid-Rise Tower Section (Days 151–250) -->
  <polygon
    points="470,580 730,580 700,360 500,360"
    fill="url(#spireGlow)"
    stroke="#818cf8"
    stroke-width="2.5"
  />

  <!-- High-Rise Tower Section (Days 251–320) -->
  <polygon
    points="500,360 700,360 670,190 530,190"
    fill="url(#spireGlow)"
    stroke="#c084fc"
    stroke-width="2.5"
  />

  <!-- Sexy Curved Aerodynamic Crown & Lantern (Days 321–350) -->
  <path
    d="M 530 190 Q 600 130 670 190 L 650 120 Q 600 95 550 120 Z"
    fill="url(#glassFacade)"
    stroke="#e0e7ff"
    stroke-width="2"
  />

  <!-- Apex Needle Spire (Days 351–365) -->
  <line x1="600" y1="120" x2="600" y2="70" stroke="#f8fafc" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)"/>
  <circle cx="600" cy="68" r="6" fill="#f43f5e" class="beacon"/>
  <circle cx="600" cy="68" r="14" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.6" class="beacon"/>

  <!-- Superstructure Glass Mullions & Cross-Bracing (Sexy Architectural Detail) -->
  <g stroke="#ffffff" stroke-width="0.75" opacity="0.4">
    <!-- Horizontal floor floorplates (Every 10 days of iterative build) -->
    <line x1="445" y1="730" x2="755" y2="730"/>
    <line x1="450" y1="690" x2="750" y2="690"/>
    <line x1="460" y1="640" x2="740" y2="640"/>
    
    <line x1="475" y1="530" x2="725" y2="530"/>
    <line x1="480" y1="480" x2="720" y2="480"/>
    <line x1="490" y1="420" x2="710" y2="420"/>

    <line x1="505" y1="320" x2="695" y2="320"/>
    <line x1="515" y1="270" x2="685" y2="270"/>
    <line x1="525" y1="220" x2="675" y2="220"/>

    <!-- Diagonal Aerodynamic Diagrid Bracing -->
    <line x1="440" y1="770" x2="730" y2="580"/>
    <line x1="760" y1="770" x2="470" y2="580"/>
    <line x1="470" y1="580" x2="700" y2="360"/>
    <line x1="730" y1="580" x2="500" y2="360"/>
    <line x1="500" y1="360" x2="670" y2="190"/>
    <line x1="700" y1="360" x2="530" y2="190"/>
  </g>

  <!-- ================= TUNED MASS DAMPER (THE VOLATILITY KILLER) ================= -->
  <!-- Suspended inside Crown at Level 88 (Days 280–320) -->
  <g class="damper-motion">
    <!-- Suspension Steel Cables -->
    <line x1="575" y1="170" x2="592" y2="225" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="625" y1="170" x2="608" y2="225" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- Heavy 660-Ton Golden Pendulum Damper Sphere -->
    <circle cx="600" cy="235" r="26" fill="url(#damperCore)" stroke="#fef08a" stroke-width="2" filter="url(#neonGlow)"/>
    
    <!-- Damper Hydraulic Actuators (Counter-Sway Pistons) -->
    <line x1="550" y1="242" x2="574" y2="238" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
    <line x1="650" y1="242" x2="626" y2="238" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>

    <text class="mono" x="600" y="278" text-anchor="middle" font-size="9" font-weight="900" fill="#fde047">
      TUNED MASS DAMPER (TMD)
    </text>
    <text class="mono" x="600" y="290" text-anchor="middle" font-size="8" fill="#cbd5e1">
      VOLATILITY ABSORPTION: -42% SWAY
    </text>
  </g>

  <!-- ================= ARCHITECTURAL ANNOTATION CALLOUTS ================= -->
  
  <!-- Callout 1: Tuned Mass Damper & Weather Volatility (Crown) -->
  <g class="sans" transform="translate(730, 200)">
    <polyline points="0,35 -55,35" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="-55" cy="35" r="3.5" fill="#f59e0b"/>
    <rect x="0" y="0" width="380" height="76" rx="8" fill="rgba(255,255,255,0.92)" stroke="#f59e0b" stroke-width="1.2" filter="url(#stampShadow)"/>
    <text x="14" y="22" font-size="12" font-weight="800" fill="#b45309">&#9889; TUNED MASS DAMPER (CROWN)</text>
    <text x="14" y="40" font-size="10" font-weight="600" fill="#1e293b">Anticipates 365-day atmospheric volatility &amp; shear.</text>
    <text x="14" y="56" font-size="9.5" fill="#64748b">Counter-oscillates against vendor drift &amp; upstream breaks.</text>
    <text x="14" y="68" font-size="9" font-weight="700" fill="#10b981">&#10003; NIST AI RMF: MANAGE 1.1 Mitigation Bridge</text>
  </g>

  <!-- Callout 2: Aerodynamic Facade & EU AI Act Transparency (Mid-Rise) -->
  <g class="sans" transform="translate(740, 410)">
    <polyline points="0,35 -30,35" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="-30" cy="35" r="3.5" fill="#818cf8"/>
    <rect x="0" y="0" width="380" height="76" rx="8" fill="rgba(255,255,255,0.92)" stroke="#818cf8" stroke-width="1.2" filter="url(#stampShadow)"/>
    <text x="14" y="22" font-size="12" font-weight="800" fill="#4338ca">&#128737; AERODYNAMIC CURTAIN WALL (MID-RISE)</text>
    <text x="14" y="40" font-size="10" font-weight="600" fill="#1e293b">Deflects vortex shedding and regulatory scrutiny.</text>
    <text x="14" y="56" font-size="9.5" fill="#64748b">High-transparency low-iron glass for auditable output.</text>
    <text x="14" y="68" font-size="9" font-weight="700" fill="#4338ca">&#10003; EU AI Act: Articles 11, 13 &amp; 15 Conformity</text>
  </g>

  <!-- Callout 3: Bedrock Caissons & Data Governance (Base) -->
  <g class="sans" transform="translate(740, 680)">
    <polyline points="0,35 -20,70" fill="none" stroke="#0284c7" stroke-width="1.5"/>
    <circle cx="-20" cy="70" r="3.5" fill="#0284c7"/>
    <rect x="0" y="0" width="380" height="76" rx="8" fill="rgba(255,255,255,0.92)" stroke="#0284c7" stroke-width="1.2" filter="url(#stampShadow)"/>
    <text x="14" y="22" font-size="12" font-weight="800" fill="#0369a1">&#127963; DEEP CAISSON FOUNDATION (BASE)</text>
    <text x="14" y="40" font-size="10" font-weight="600" fill="#1e293b">Anchored into crystalline Manhattan schist bedrock.</text>
    <text x="14" y="56" font-size="9.5" fill="#64748b">Zero-trust cryptographic isolation &amp; continuous risk logs.</text>
    <text x="14" y="68" font-size="9" font-weight="700" fill="#0369a1">&#10003; EU AI Act: Articles 9 &amp; 10 Data Governance</text>
  </g>

  <!-- ================= OFFICIAL LEGAL COMPLIANCE STAMP BLOCK ================= -->
  <g class="mono" transform="translate(60, 640)">
    <!-- Official Blueprint Stamp Border -->
    <rect width="320" height="150" rx="8" fill="rgba(255,255,255,0.95)" stroke="#0f172a" stroke-width="2" filter="url(#stampShadow)"/>
    <rect x="4" y="4" width="312" height="142" rx="6" fill="none" stroke="#0f172a" stroke-width="0.8" stroke-dasharray="4,2"/>
    
    <text x="160" y="28" text-anchor="middle" font-size="12" font-weight="900" fill="#0f172a" letter-spacing="1">
      OFFICIAL BUILDING REGISTRATION
    </text>
    <line x1="20" y1="36" x2="300" y2="36" stroke="#0f172a" stroke-width="1"/>

    <text x="20" y="56" font-size="10" font-weight="700" fill="#0f172a">PROJECT: SYNOPTIC SPIRE // APEX TOWER</text>
    <text x="20" y="72" font-size="9.5" fill="#334155">TOTAL HEIGHT: 828 METERS (365 ITERATIONS)</text>
    <text x="20" y="88" font-size="9.5" fill="#334155">VOLATILITY TOLERANCE: CAT-5 GALE / 160 MPH</text>
    <text x="20" y="104" font-size="9.5" font-weight="700" fill="#10b981">&#10003; EU AI ACT HIGH-RISK CERTIFICATE: PASSED</text>
    <text x="20" y="120" font-size="9.5" font-weight="700" fill="#0284c7">&#10003; NIST AI RMF 1.0 (GOVERN/MAP): CERTIFIED</text>
    
    <!-- Red Rubber Stamp Effect -->
    <g transform="translate(210, 85) rotate(-12)">
      <rect width="90" height="32" rx="4" fill="none" stroke="#ef4444" stroke-width="2"/>
      <text x="45" y="18" text-anchor="middle" font-size="10" font-weight="900" fill="#ef4444">LEGAL PERMIT</text>
      <text x="45" y="27" text-anchor="middle" font-size="7" font-weight="800" fill="#ef4444">APPROVED [PT:AC]</text>
    </g>
  </g>

  <!-- Bottom Coordinates -->
  <g class="mono" font-size="9" fill="#94a3b8" text-anchor="middle">
    <text x="600" y="885">
      FIGURE 1.0 // AERODYNAMIC ARCHITECTURAL ELEVATION &#8226; ISO/IEC 42001 &#8226; CITIZEN SCIENCE 15 U.S.C. &#167; 3724
    </text>
  </g>
</svg>
