<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="680"
  viewBox="0 0 1200 680"
  role="img"
  aria-labelledby="title desc">

  <title id="title">Project Risk Forecast — Multi-Year Roadway Intelligence</title>
  <desc id="desc">
    Visual multi-year project risk forecast mapping smooth cruising, potholes, traffic gridlock,
    and detour routes across 1 to 5+ year enterprise rollouts.
  </desc>

  <defs>
    <!-- Gradients for Road Conditions -->
    <linearGradient id="smoothGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="potholeGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="trafficGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="closureGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="detourGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="highwayRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="72%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    
    @keyframes pulseWarning {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }

    .road-flow {
      stroke-dasharray: 10, 10;
      animation: dashFlow 2s linear infinite;
    }
    .detour-flow {
      stroke-dasharray: 8, 6;
      animation: dashFlow 1.6s linear infinite;
    }
    .pulse-pin {
      animation: pulseWarning 2.5s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- DELIBERATELY NO BACKGROUND RECTANGLE: GitHub Background shows naturally -->

  <!-- ================= TOP HEADER ================= -->
  <g class="mono">
    <text x="40" y="38" font-size="14" font-weight="700" fill="#475569" letter-spacing="0.5">
      PROJECT RISK FORECAST // MULTI-YEAR HIGHWAY INTELLIGENCE
    </text>
    <text x="1160" y="38" text-anchor="end" font-size="13" fill="#64748b">
      HORIZON: 1–5+ YEARS &#8226; ZERO-TRUST ARCHITECTURE
    </text>
  </g>

  <!-- ================= HIGHWAY CONDITION LEGEND BAR ================= -->
  <g class="sans" font-size="11" font-weight="700">
    <!-- Smooth Cruising -->
    <rect x="40" y="60" width="190" height="26" rx="13" fill="rgba(16,185,129,0.12)" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="55" cy="73" r="5" fill="#10b981"/>
    <text x="68" y="77" fill="#047857">SMOOTH CRUISING</text>

    <!-- Potholes -->
    <rect x="245" y="60" width="180" height="26" rx="13" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.2"/>
    <circle cx="260" cy="73" r="5" fill="#f59e0b"/>
    <text x="273" y="77" fill="#b45309">POTHOLES / BUMPS</text>

    <!-- Heavy Traffic -->
    <rect x="440" y="60" width="200" height="26" rx="13" fill="rgba(249,115,22,0.12)" stroke="#f97316" stroke-width="1.2"/>
    <circle cx="455" cy="73" r="5" fill="#f97316"/>
    <text x="468" y="77" fill="#c2410c">TRAFFIC / BOTTLENECK</text>

    <!-- Road Closed / Detour -->
    <rect x="655" y="60" width="210" height="26" rx="13" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.2"/>
    <circle cx="670" cy="73" r="5" fill="#ef4444"/>
    <text x="683" y="77" fill="#b91c1c">ROAD CLOSED / DETOUR</text>

    <!-- Horizon Scope -->
    <rect x="880" y="60" width="280" height="26" rx="13" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="1.2"/>
    <circle cx="895" cy="73" r="5" fill="#8b5cf6"/>
    <text x="908" y="77" fill="#6d28d9">MULTI-YEAR COMMENCEMENT</text>
  </g>

  <!-- ================= MAIN HIGHWAY ARTERY (THE MULTI-YEAR CORRIDOR) ================= -->
  <!-- Outer Highway Asphalt Bed -->
  <path
    d="M 60 270 C 250 270, 320 200, 520 200 C 720 200, 800 320, 1000 320 L 1140 320"
    fill="none"
    stroke="#e2e8f0"
    stroke-width="56"
    stroke-linecap="round"
  />

  <!-- Highway Core Surface (Color-coded Synoptic State) -->
  <path
    d="M 60 270 C 250 270, 320 200, 520 200 C 720 200, 800 320, 1000 320 L 1140 320"
    fill="none"
    stroke="url(#highwayRibbon)"
    stroke-width="40"
    stroke-linecap="round"
  />

  <!-- Center Lane Marking (Animated Traffic Flow) -->
  <path
    d="M 60 270 C 250 270, 320 200, 520 200 C 720 200, 800 320, 1000 320 L 1140 320"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    class="road-flow"
  />

  <!-- ================= DETOUR / BYPASS ARTERY (OVERCOMING THE BREAKING POINT) ================= -->
  <!-- The Architectural Detour Bypass -->
  <path
    d="M 760 226 C 810 130, 940 140, 990 310"
    fill="none"
    stroke="url(#detourGrad)"
    stroke-width="14"
    stroke-linecap="round"
    opacity="0.85"
  />
  <path
    d="M 760 226 C 810 130, 940 140, 990 310"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    class="detour-flow"
  />
  <g class="sans">
    <rect x="800" y="115" width="160" height="24" rx="12" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5"/>
    <text x="880" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">
      &#8635; ARCHITECTURAL DETOUR
    </text>
  </g>

  <!-- ================= WAYPOINTS & HAZARDS ALONG THE HIGHWAY ================= -->

  <!-- YEAR 1: Month 0–12 (Initiation & Scaffolding) -->
  <g class="sans" transform="translate(100, 270)">
    <circle cx="0" cy="0" r="16" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Y1</text>
    
    <!-- Info Card -->
    <g transform="translate(-70, 45)" filter="url(#cardShadow)">
      <rect width="160" height="66" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="800" fill="#0f172a">INITIATION &amp; SCOPE</text>
      <text x="12" y="38" font-size="10" fill="#64748b">Months 0&#8211;12</text>
      <text x="12" y="54" font-size="10" font-weight="700" fill="#10b981">&#10003; Clear Runway (Smooth)</text>
    </g>
  </g>

  <!-- HAZARD 1: Month 10 (Pothole - Tech Debt / Tooling Drift) -->
  <g class="sans" transform="translate(290, 240)">
    <circle cx="0" cy="0" r="12" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" class="pulse-pin"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">!</text>
    
    <!-- Info Card -->
    <g transform="translate(-75, -78)" filter="url(#cardShadow)">
      <rect width="170" height="62" rx="8" fill="#ffffff" stroke="#fcd34d" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="800" fill="#b45309">&#9888; POTHOLE (Month 10)</text>
      <text x="10" y="34" font-size="10" fill="#475569">Dependency Version Drift</text>
      <text x="10" y="50" font-size="9.5" font-weight="600" fill="#6b7280">Mitigation: Lockfiles pinned</text>
    </g>
  </g>

  <!-- YEAR 2: Month 12–24 (Deep Build & Core Pipeline) -->
  <g class="sans" transform="translate(480, 200)">
    <circle cx="0" cy="0" r="16" fill="#f97316" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="900" fill="#ffffff">Y2</text>
    
    <!-- Info Card -->
    <g transform="translate(-75, 45)" filter="url(#cardShadow)">
      <rect width="175" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="12" y="20" font-size="11" font-weight="800" fill="#0f172a">DEEP BUILD PHASE</text>
      <text x="12" y="36" font-size="10" fill="#64748b">Months 12&#8211;24</text>
      <text x="12" y="52" font-size="10" font-weight="700" fill="#ea580c">&#9881; Traffic Ahead (M18)</text>
      <text x="12" y="66" font-size="9" fill="#64748b">Security &amp; Legal Reviews</text>
    </g>
  </g>

  <!-- HAZARD 2: Month 18 (Heavy Traffic / Review Gridlock) -->
  <g class="sans" transform="translate(600, 205)">
    <circle cx="0" cy="0" r="12" fill="#f97316" stroke="#ffffff" stroke-width="2.5" class="pulse-pin"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="900" fill="#ffffff">&#9776;</text>
    
    <!-- Info Card -->
    <g transform="translate(-80, -78)" filter="url(#cardShadow)">
      <rect width="180" height="62" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
      <text x="10" y="18" font-size="11" font-weight="800" fill="#c2410c">&#128678; BOTTLENECK (M18)</text>
      <text x="10" y="34" font-size="10" fill="#475569">Multi-Entity Governance</text>
      <text x="10" y="50" font-size="9.5" font-weight="600" fill="#6b7280">Mitigation: Pre-cleared audit</text>
    </g>
  </g>

  <!-- HAZARD 3: Month 28 (Road Closed / Architectural Breaking Point) -->
  <g class="sans" transform="translate(760, 230)">
    <circle cx="0" cy="0" r="14" fill="#ef4444" stroke="#ffffff" stroke-width="3" class="pulse-pin"/>
    <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">&#10005;</text>
    
    <!-- Info Card -->
    <g transform="translate(-85, 45)" filter="url(#cardShadow)">
      <rect width="190" height="74" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.4"/>
      <text x="10" y="18" font-size="11" font-weight="800" fill="#b91c1c">&#9940; ROAD CLOSED (M28)</text>
      <text x="10" y="34" font-size="10" fill="#475569">Upstream Schema Deprecation</text>
      <text x="10" y="50" font-size="9.5" font-weight="700" fill="#8b5cf6">&#8635; Active Detour Triggered</text>
      <text x="10" y="65" font-size="9" fill="#64748b">Zero downtime adapter deployed</text>
    </g>
  </g>

  <!-- YEAR 3–5: Month 36–60+ (Commencement & Durability) -->
  <g class="sans" transform="translate(1060, 320)">
    <circle cx="0" cy="0" r="18" fill="#10b981" stroke="#ffffff" stroke-width="3.5"/>
    <text x="0" y="6" text-anchor="middle" font-size="13" font-weight="900" fill="#ffffff">Y5+</text>
    
    <!-- Info Card -->
    <g transform="translate(-100, 45)" filter="url(#cardShadow)">
      <rect width="200" height="70" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="12" y="20" font-size="11" font-weight="800" fill="#047857">&#9733; COMMENCEMENT</text>
      <text x="12" y="36" font-size="10" fill="#475569">Months 36&#8211;60+ Enterprise Scale</text>
      <text x="12" y="52" font-size="10" font-weight="700" fill="#059669">&#10003; Continuous Durability</text>
    </g>
  </g>

  <!-- ================= LIVE SYNOPTIC RISK STATUS PANEL (BOTTOM) ================= -->
  <g class="sans" transform="translate(40, 520)">
    <rect width="1120" height="120" rx="14" fill="rgba(248,250,252,0.85)" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Column 1: Overall Highway State -->
    <g transform="translate(25, 25)">
      <text font-family="mono" font-size="10.5" font-weight="700" fill="#64748b">CURRENT HIGHWAY CONDITION</text>
      <rect x="0" y="10" width="220" height="34" rx="17" fill="rgba(249,115,22,0.12)" stroke="#f97316" stroke-width="1.2"/>
      <circle cx="16" cy="27" r="5" fill="#f97316"/>
      <text x="30" y="31" font-size="12" font-weight="800" fill="#c2410c">MODERATE CONGESTION (Y2)</text>
      <text x="0" y="62" font-size="10" fill="#475569">Governance &amp; security gate clearance active.</text>
    </g>

    <!-- Divider -->
    <line x1="280" y1="20" x2="280" y2="100" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Column 2: Breaking Point / Detour Status -->
    <g transform="translate(305, 25)">
      <text font-family="mono" font-size="10.5" font-weight="700" fill="#64748b">PROJECTED BREAKING POINT &amp; DETOUR</text>
      <text x="0" y="24" font-size="13" font-weight="800" fill="#b91c1c">&#9940; Month 28: Upstream Schema Deprecation</text>
      <text x="0" y="44" font-size="11" font-weight="700" fill="#6d28d9">&#8635; Detour Strategy: Dual-Ingestion Adapter Bridge</text>
      <text x="0" y="62" font-size="10" fill="#64748b">Bypasses hard stoppage without downtime or vendor lock-in.</text>
    </g>

    <!-- Divider -->
    <line x1="720" y1="20" x2="720" y2="100" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Column 3: Multi-Year Cadence -->
    <g transform="translate(745, 25)">
      <text font-family="mono" font-size="10.5" font-weight="700" fill="#64748b">HORIZON PLANNING CADENCE</text>
      <text x="0" y="24" font-size="13" font-weight="800" fill="#0f172a">18 to 60+ Months Durability</text>
      <text x="0" y="44" font-size="11" font-weight="600" fill="#475569">Synoptic Risk Audits: Quarterly Refresh Cycle</text>
      <text x="0" y="62" font-size="10" fill="#64748b">Validated against: Zero-Trust Architectural Gates</text>
    </g>
  </g>

  <!-- Footer text -->
  <g class="mono" font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="600" y="665">
      AИDY'S RISK FORECAST &#8226; 15 U.S.C. &#167; 3724 Citizen Science &#8226; Architectural Durability
    </text>
  </g>
</svg>
